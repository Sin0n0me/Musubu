name: License Check

on:
  push:
    branches:
      - master
  pull_request:

env:
  RUST_TOOLCHAIN: "stable"
  CARGO_DENY_VERSION: "0.19.0"

jobs:
  license-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        run: |
          expected="cargo-deny ${CARGO_DENY_VERSION}"
          actual="$(cargo-deny --version 2>/dev/null || true)"
          if [ "$actual" != "$expected" ]; then
            cargo +stable install cargo-deny --version "${CARGO_DENY_VERSION}" --locked --force
          fi
          test "$(cargo-deny --version)" = "$expected"
          cargo-deny --version

      - name: License check
        run: |
          cargo deny check licenses
